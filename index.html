<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#10120f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SNAKE">
  <title>SNAKE — Аркада</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10120f;
      --panel: #191d17;
      --panel-2: #20251d;
      --line: #343d2d;
      --text: #f1f4e9;
      --muted: #9aa391;
      --lime: #c4f36b;
      --lime-dark: #8fb73e;
      --red: #ff6d5e;
      --radius: 22px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { overscroll-behavior: none; }
    button { font: inherit; cursor: pointer; border: 0; color: inherit; }
    .shell { width: min(100%, 580px); margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 18px max(22px, env(safe-area-inset-bottom)); }
    header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin: 8px 2px 24px; }
    .brand { display:flex; align-items:center; gap:11px; }
    .brand-mark { width:42px; height:42px; border-radius:14px; display:grid; place-items:center; background:var(--lime); color:#14180e; font-size:23px; box-shadow:0 5px 22px #c4f36b1b; }
    .brand-title { margin:0; font-size:19px; font-weight:900; letter-spacing:.16em; }
    .brand-sub { margin:4px 0 0; color:var(--muted); font-size:10px; letter-spacing:.18em; text-transform:uppercase; }
    .sound-btn { width:42px; height:42px; border:1px solid var(--line); background:var(--panel); border-radius:14px; color:var(--muted); font-size:17px; }
    .score-row { display:grid; grid-template-columns:1fr 1fr 1.2fr; gap:9px; margin-bottom:14px; }
    .stat { min-width:0; background:var(--panel); border:1px solid #293026; border-radius:15px; padding:12px 13px; }
    .stat-label { color:var(--muted); text-transform:uppercase; letter-spacing:.12em; font-size:9px; font-weight:800; }
    .stat-value { margin-top:5px; font-size:24px; font-weight:850; line-height:1.05; font-variant-numeric:tabular-nums; }
    .stat-value.lime { color:var(--lime); }
    .game-frame { position:relative; overflow:hidden; padding:9px; border:1px solid #333d2d; border-radius:24px; background:#151912; box-shadow:0 18px 55px #0005; }
    .board-wrap { position:relative; width:100%; aspect-ratio:1; overflow:hidden; border-radius:16px; background:#11150f; touch-action:none; }
    canvas { display:block; width:100%; height:100%; touch-action:none; }
    .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; background:#0b0e0bcf; backdrop-filter:blur(5px); text-align:center; }
    .overlay.hidden { display:none; }
    .overlay-card { width:100%; max-width:300px; }
    .overlay-icon { font-size:42px; margin-bottom:10px; filter:drop-shadow(0 0 20px #c4f36b30); }
    .overlay h2 { font-size:27px; line-height:1.05; margin:0 0 10px; font-weight:900; letter-spacing:-.04em; }
    .overlay p { margin:0 auto 22px; max-width:250px; font-size:13px; line-height:1.55; color:#adb5a4; }
    .primary { min-height:50px; width:100%; padding:14px 18px; border-radius:15px; background:var(--lime); color:#15190f; font-size:14px; font-weight:900; box-shadow:0 7px 24px #c4f36b18; }
    .primary:active { transform:scale(.985); }
    .game-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:13px; }
    .secondary { min-height:47px; padding:12px 14px; border-radius:14px; background:var(--panel); border:1px solid var(--line); font-size:13px; font-weight:750; color:#dfe5d6; }
    .secondary:active, .sound-btn:active, .dir:active { background:#2c3523; }
    .controls { width:190px; margin:18px auto 0; display:grid; grid-template-columns:repeat(3, 58px); grid-template-rows:repeat(2, 54px); gap:7px; justify-content:center; }
    .dir { background:var(--panel-2); border:1px solid #35402b; border-radius:16px; color:var(--lime); font-size:21px; font-weight:900; touch-action:manipulation; box-shadow:0 4px 0 #0a0c09; }
    .dir.up { grid-column:2; grid-row:1; }
    .dir.left { grid-column:1; grid-row:2; }
    .dir.down { grid-column:2; grid-row:2; }
    .dir.right { grid-column:3; grid-row:2; }
    .hint { margin:17px 0 0; color:#727c68; font-size:11px; line-height:1.6; text-align:center; }
    .hint strong { color:#a7b096; font-weight:700; }
    .footer { display:flex; justify-content:center; gap:7px; align-items:center; margin-top:19px; color:#66705e; font-size:10px; letter-spacing:.12em; text-transform:uppercase; }
    .footer-dot { width:4px; height:4px; border-radius:50%; background:var(--lime-dark); }
    @media (min-width:520px) { .shell { padding-top:28px; } header { margin-bottom:27px; } .controls { margin-top:17px; } }
    @media (max-height:780px) and (max-width:520px) { .shell { padding-top:max(10px, env(safe-area-inset-top)); } header { margin-bottom:14px; } .brand-mark { width:36px;height:36px; } .stat { padding:9px 11px; } .stat-value { font-size:21px; } .controls { margin-top:12px; grid-template-rows:repeat(2,48px); } .dir { border-radius:13px; } .hint { margin-top:11px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">↗</div>
        <div><h1 class="brand-title">SNAKE</h1><p class="brand-sub">Classic arcade · 001</p></div>
      </div>
      <button class="sound-btn" id="soundBtn" aria-label="Звук включён" title="Включить или выключить звук">♪</button>
    </header>

    <section class="score-row" aria-label="Статистика игры">
      <div class="stat"><div class="stat-label">Счёт</div><div class="stat-value lime" id="score">000</div></div>
      <div class="stat"><div class="stat-label">Рекорд</div><div class="stat-value" id="best">000</div></div>
      <div class="stat"><div class="stat-label">Уровень</div><div class="stat-value" id="level">01 <span style="font-size:11px;color:var(--muted);font-weight:700">· EASY</span></div></div>
    </section>

    <section class="game-frame" aria-label="Игровое поле">
      <div class="board-wrap" id="boardWrap">
        <canvas id="game" width="600" height="600" aria-label="Поле игры Змейка"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay-card">
            <div class="overlay-icon" id="overlayIcon">✳</div>
            <h2 id="overlayTitle">Готов играть?</h2>
            <p id="overlayText">Собирай энергию, расти и не врезайся в стены или собственный хвост.</p>
            <button class="primary" id="mainBtn">НАЧАТЬ ИГРУ&nbsp; ↗</button>
          </div>
        </div>
      </div>
    </section>

    <div class="game-actions">
      <button class="secondary" id="pauseBtn">Ⅱ &nbsp; Пауза</button>
      <button class="secondary" id="restartBtn">↻ &nbsp; Заново</button>
    </div>

    <div class="controls" aria-label="Управление">
      <button class="dir up" data-dir="up" aria-label="Вверх">↑</button>
      <button class="dir left" data-dir="left" aria-label="Влево">←</button>
      <button class="dir down" data-dir="down" aria-label="Вниз">↓</button>
      <button class="dir right" data-dir="right" aria-label="Вправо">→</button>
    </div>

    <p class="hint"><strong>Свайпай по полю</strong> или нажимай стрелки.<br>На компьютере также работают клавиши <strong>W A S D</strong> и <strong>← ↑ → ↓</strong>.</p>
    <div class="footer"><span>Stay sharp</span><span class="footer-dot"></span><span>Beat your best</span></div>
  </main>

  <script>
    (() => {
      'use strict';
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const overlay = document.getElementById('overlay');
      const overlayIcon = document.getElementById('overlayIcon');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayText = document.getElementById('overlayText');
      const mainBtn = document.getElementById('mainBtn');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const levelEl = document.getElementById('level');
      const pauseBtn = document.getElementById('pauseBtn');
      const soundBtn = document.getElementById('soundBtn');
      const boardWrap = document.getElementById('boardWrap');

      const N = 20;
      const CELL = canvas.width / N;
      let snake, food, direction, nextDirection, score, best = readBest();
      let running = false, paused = false, over = false, started = false;
      let lastTime = 0, accumulator = 0, soundOn = false, audioCtx = null;
      let pulse = 0, touchStart = null;

      function readBest() {
        try { return Number(localStorage.getItem('snake-best') || 0); }
        catch (_) { return 0; }
      }
      function saveBest() {
        try { localStorage.setItem('snake-best', String(best)); } catch (_) {}
      }
      function fmt(num) { return String(num).padStart(3, '0'); }
      function updateStats() {
        scoreEl.textContent = fmt(score || 0);
        bestEl.textContent = fmt(best);
        const level = Math.floor((score || 0) / 5) + 1;
        levelEl.innerHTML = String(level).padStart(2, '0') + ' <span style="font-size:11px;color:var(--muted);font-weight:700">· ' + (level < 3 ? 'EASY' : level < 6 ? 'MID' : 'FAST') + '</span>';
      }
      function speed() { return Math.max(65, 145 - Math.floor(score / 5) * 10); }
      function spawnFood() {
        let point;
        do {
          point = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
        } while (snake.some(s => s.x === point.x && s.y === point.y));
        food = point;
      }
      function resetGame() {
        snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10},{x:6,y:10}];
        direction = {x:1,y:0}; nextDirection = {x:1,y:0};
        score = 0; pulse = 0; paused = false; over = false; running = false; accumulator = 0;
        spawnFood(); updateStats(); draw();
        pauseBtn.textContent = 'Ⅱ  Пауза';
      }
      function startGame() {
        if (over) resetGame();
        running = true; paused = false; started = true; lastTime = 0; accumulator = 0;
        overlay.classList.add('hidden');
        pauseBtn.textContent = 'Ⅱ  Пауза';
        requestAnimationFrame(loop);
      }
      function showOverlay(icon, title, text, button) {
        overlayIcon.textContent = icon;
        overlayTitle.textContent = title;
        overlayText.textContent = text;
        mainBtn.innerHTML = button;
        overlay.classList.remove('hidden');
      }
      function endGame() {
        running = false; paused = false; over = true;
        if (score > best) { best = score; saveBest(); }
        updateStats();
        pauseBtn.textContent = 'Ⅱ  Пауза';
        showOverlay('×', 'Игра окончена', score > 0 ? 'Твой счёт — ' + score + '. Ещё одна попытка и новый рекорд?' : 'Бывает. Попробуй ещё раз — теперь ты знаешь поле.', 'ИГРАТЬ ЕЩЁ  ↻');
        tone(130, .15, 'sawtooth');
      }
      function setDirection(dir) {
        const dirs = {up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}};
        const d = dirs[dir]; if (!d) return;
        if (d.x === -direction.x && d.y === -direction.y) return;
        nextDirection = d;
        if (!started && !over) startGame();
        else if (paused) togglePause();
      }
      function step() {
        direction = nextDirection;
        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
        const ate = head.x === food.x && head.y === food.y;
        if (head.x < 0 || head.x >= N || head.y < 0 || head.y >= N) { endGame(); return; }
        const bodyToCheck = ate ? snake : snake.slice(0, -1);
        if (bodyToCheck.some(s => s.x === head.x && s.y === head.y)) { endGame(); return; }
        snake.unshift(head);
        if (ate) {
          score += 1; pulse = 1;
          if (score > best) { best = score; saveBest(); }
          spawnFood(); updateStats(); tone(440 + Math.min(score, 20) * 18, .07, 'sine');
        } else snake.pop();
      }
      function roundedRect(c, x, y, w, h, r) {
        c.beginPath(); c.roundRect(x, y, w, h, r); c.fill();
      }
      function draw() {
        const w = canvas.width, h = canvas.height;
        ctx.clearRect(0,0,w,h);
        ctx.fillStyle = '#11150f'; ctx.fillRect(0,0,w,h);
        // Subtle checkerboard grid.
        for (let y=0;y<N;y++) for (let x=0;x<N;x++) {
          if ((x+y)%2===0) { ctx.fillStyle = '#151a12'; ctx.fillRect(x*CELL,y*CELL,CELL,CELL); }
        }
        ctx.strokeStyle = '#273021'; ctx.lineWidth = 1;
        for(let i=0;i<=N;i++) {
          ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,h);ctx.stroke();
          ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(w,i*CELL);ctx.stroke();
        }
        // Food glow and core.
        const fx = (food.x+.5)*CELL, fy = (food.y+.5)*CELL;
        const glow = ctx.createRadialGradient(fx,fy,2,fx,fy,CELL*.72);
        glow.addColorStop(0,'#ff765c66'); glow.addColorStop(1,'#ff765c00');
        ctx.fillStyle = glow; ctx.fillRect(fx-CELL,fy-CELL,CELL*2,CELL*2);
        ctx.fillStyle = '#ff705d'; roundedRect(ctx,food.x*CELL+CELL*.22,food.y*CELL+CELL*.22,CELL*.56,CELL*.56,CELL*.18);
        ctx.fillStyle = '#ffb2a3'; ctx.beginPath();ctx.arc(fx-CELL*.09,fy-CELL*.09,CELL*.075,0,Math.PI*2);ctx.fill();
        // Snake: tail fades to brighter head.
        snake.forEach((s,i) => {
          const inset = i===0 ? 1.5 : 2.4;
          const x=s.x*CELL+inset,y=s.y*CELL+inset,size=CELL-inset*2;
          const t = Math.max(0,1-i/Math.max(1,snake.length));
          const r = Math.round(111 + t*85), g = Math.round(151 + t*102), b = Math.round(52 + t*42);
          ctx.fillStyle = `rgb(${r},${g},${b})`;
          roundedRect(ctx,x,y,size,size,i===0?CELL*.26:CELL*.20);
          if (i===0) {
            // Eyes point in the direction of travel.
            const perp = {x:-direction.y,y:direction.x};
            const eyeForward = CELL*.12, eyeSide = CELL*.16;
            const ex = (s.x+.5+direction.x*eyeForward/CELL)*CELL;
            const ey = (s.y+.5+direction.y*eyeForward/CELL)*CELL;
            ctx.fillStyle='#18200f';
            for (const sign of [-1,1]) {
              ctx.beginPath();ctx.arc(ex+perp.x*eyeSide*sign,ey+perp.y*eyeSide*sign,CELL*.055,0,Math.PI*2);ctx.fill();
            }
          } else if (i % 4 === 0) {
            ctx.fillStyle = '#efffb72a'; roundedRect(ctx,x+CELL*.16,y+CELL*.16,size*.22,size*.22,CELL*.06);
          }
        });
      }
      function loop(timestamp) {
        if (!running || paused) return;
        if (!lastTime) lastTime = timestamp;
        const delta = Math.min(timestamp - lastTime, 250); lastTime = timestamp;
        accumulator += delta; pulse = Math.max(0,pulse-delta/230);
        let interval = speed();
        while (accumulator >= interval && running && !paused) { step(); accumulator -= interval; interval = speed(); }
        draw();
        if (running && !paused) requestAnimationFrame(loop);
      }
      function togglePause() {
        if (over || !started) return;
        if (!running && !paused) return;
        if (paused) {
          paused = false; running = true; lastTime = 0; pauseBtn.textContent = 'Ⅱ  Пауза';
          overlay.classList.add('hidden'); requestAnimationFrame(loop);
        } else {
          paused = true; running = false; pauseBtn.textContent = '▶  Продолжить';
          showOverlay('Ⅱ','Пауза','Переведи дух. Когда будешь готов — продолжай.','ПРОДОЛЖИТЬ  ▶');
        }
      }
      function tone(freq, duration, type) {
        if (!soundOn) return;
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
          osc.type = type || 'sine'; osc.frequency.value = freq;
          gain.gain.setValueAtTime(.055,audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
          osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+duration);
        } catch (_) {}
      }
      mainBtn.addEventListener('click', () => {
        if (paused) { togglePause(); return; }
        startGame();
      });
      document.getElementById('restartBtn').addEventListener('click', () => { resetGame(); started = false; showOverlay('✳','Готов играть?','Собирай энергию, расти и не врезайся в стены или собственный хвост.','НАЧАТЬ ИГРУ  ↗'); });
      pauseBtn.addEventListener('click', () => { if (!started && !over) startGame(); else togglePause(); });
      document.querySelectorAll('[data-dir]').forEach(btn => {
        btn.addEventListener('pointerdown', e => { e.preventDefault(); setDirection(btn.dataset.dir); });
      });
      soundBtn.addEventListener('click', () => {
        soundOn = !soundOn;
        soundBtn.textContent = soundOn ? '♫' : '♪';
        soundBtn.style.color = soundOn ? 'var(--lime)' : 'var(--muted)';
        soundBtn.setAttribute('aria-label', soundOn ? 'Выключить звук' : 'Включить звук');
        if(soundOn) tone(520,.06,'sine');
      });
      document.addEventListener('keydown', e => {
        const keys = {ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};
        if(keys[e.key]) { e.preventDefault(); setDirection(keys[e.key]); }
        if(e.code === 'Space') { e.preventDefault(); if(!started && !over) startGame(); else togglePause(); }
        if(e.key === 'Escape' && running) togglePause();
      });
      boardWrap.addEventListener('touchstart', e => {
        if(e.changedTouches.length) touchStart = {x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};
      }, {passive:true});
      boardWrap.addEventListener('touchend', e => {
        if(!touchStart || !e.changedTouches.length) return;
        const dx=e.changedTouches[0].clientX-touchStart.x, dy=e.changedTouches[0].clientY-touchStart.y;
        touchStart=null;
        if(Math.max(Math.abs(dx),Math.abs(dy))<18) return;
        if(Math.abs(dx)>Math.abs(dy)) setDirection(dx>0?'right':'left');
        else setDirection(dy>0?'down':'up');
      }, {passive:true});
      document.addEventListener('visibilitychange', () => { if(document.hidden && running) togglePause(); });
      updateStats(); resetGame();
    })();
  </script>
</body>
</html>
